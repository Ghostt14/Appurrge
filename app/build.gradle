apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 33

    buildFeatures {
        viewBinding = true
        aidl = true
    }

    defaultConfig {
        // Changed from com.saha.batchuninstaller so this build installs next to the original app.
        applicationId "com.batchuninstaller.fast"
        // Shizuku requires Android 6.0+.
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 14
        versionName "1.1"

    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            zipAlignEnabled true
        }
    }

    compileOptions {
        encoding = 'UTF-8'
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    // Keep the Kotlin/Java package (and R / BuildConfig) unchanged; only the applicationId differs.
    namespace 'com.saha.batchuninstaller'

    lint {
        // Report problems (see CI artifact) without failing the build.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.20"

    // Draggable fast-scroll thumb with a popup label.
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'

    // Shizuku: lets us uninstall (incl. system apps) without root.
    def shizuku_version = '13.1.5'
    implementation "dev.rikka.shizuku:api:$shizuku_version"
    implementation "dev.rikka.shizuku:provider:$shizuku_version"

    testImplementation 'junit:junit:4.13.2'
}
