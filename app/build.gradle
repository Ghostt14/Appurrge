apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.appurrge'
    compileSdkVersion 33

    buildFeatures {
        viewBinding = true
        aidl = true
    }

    defaultConfig {
        applicationId "com.appurrge.demo"
        // Android 7.0. This also matches Shizuku's libraries and drops the old v1 APK signature.
        minSdkVersion 24
        targetSdkVersion 33
        versionCode 7
        versionName "1.6-demo"
        // English and Spanish only; drops the other translations that AndroidX libraries bundle.
        resConfigs "en", "es"
    }

    buildTypes {
        release {
            // No keystore in the repo: sign with the debug key so the small release APK installs.
            signingConfig signingConfigs.debug
        }
        // Same shrinking for every build type, so a debug APK is as small as the release one.
        all {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        resources {
            // Files only IDEs and the Kotlin compiler read (reflection data, version stamps, debug-agent
            // data). Nothing in the app reads them at runtime. META-INF/services is kept: coroutines need it.
            excludes += [
                '/kotlin/**',
                '/kotlin-tooling-metadata.json',
                '/DebugProbesKt.bin',
                '/META-INF/*.version'
            ]
        }
    }

    lint {
        // Report problems (see the CI artifact) without failing the build.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    // Shizuku: uninstall (including system apps) without root.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    testImplementation 'junit:junit:4.13.2'
}
