apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'com.appurrge'
    compileSdkVersion 33

    buildFeatures {
        viewBinding = true
        aidl = true
    }

    defaultConfig {
        applicationId "com.appurrge"
        // Android 6.0 (Shizuku's own minimum)
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 3
        versionName "1.2"
        // The app is English only; drops the translated strings that AndroidX libraries bundle.
        resConfigs "en"
    }

    buildTypes {
        release {
            // No keystore in the repo: sign with the debug key so the small release APK installs.
            signingConfig signingConfigs.debug
        }
        // Same shrinking for every build type, so a debug APK is as small as the release one.
        all {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        // Report problems (see the CI artifact) without failing the build.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    // Shizuku: uninstall (including system apps) without root.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    testImplementation 'junit:junit:4.13.2'
}
