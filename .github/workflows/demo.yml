name: Build demo

on:
  workflow_dispatch:
  push:
    paths: ["demo/**", ".github/workflows/demo.yml"]

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - name: Generate the demo project
        run: python3 demo/make_demo.py "$RUNNER_TEMP/demo"
      - name: Test and build
        working-directory: ${{ runner.temp }}/demo
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Appurrge-Demo.apk"
      - name: Check this really is the demo app
        run: |
          aapt2="$ANDROID_HOME/build-tools/33.0.2/aapt2"
          "$aapt2" dump badging Appurrge-Demo.apk | grep -m1 "^package:"
          "$aapt2" dump badging Appurrge-Demo.apk | grep -q "package: name='com.appurrge.demo'"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Appurrge-Demo
          path: Appurrge-Demo.apk
          if-no-files-found: error
